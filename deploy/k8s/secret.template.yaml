# Template — do NOT commit a populated copy. Real secrets land via
# your secrets-management pipeline (sealed-secrets, External Secrets,
# direct kubectl create from a CI vault, etc.).
#
# The two-active-keys SULO rotation (R-RUN-1) uses SULO_API_KEY_PENDING:
#  1. Set SULO_API_KEY_PENDING to the new key.
#  2. Roll the Deployment; confirm the new key works.
#  3. Promote: copy SULO_API_KEY_PENDING into SULO_API_KEY; unset
#     SULO_API_KEY_PENDING; roll again.
apiVersion: v1
kind: Secret
metadata:
  name: translation-layer-secrets
  namespace: geonovum-testbed
type: Opaque
stringData:
  STATE_STORE_DSN: "postgres://USER:PASS@postgres-state:5432/translation_state?sslmode=require"
  # FROST write credential — Basic OR Bearer (Basic wins when the user is set).
  # WBD uses Basic Auth: username "write", password supplied out-of-band.
  FROST_WRITE_TOKEN: ""
  FROST_BASIC_AUTH_USER: "write"
  FROST_BASIC_AUTH_PASSWORD: ""
  SULO_API_BASE_URL: ""
  SULO_API_KEY: ""
  SULO_API_KEY_PENDING: ""
  FRESHNESS_ALERT_WEBHOOK_URL: ""
