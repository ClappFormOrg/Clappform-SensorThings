# Template — do NOT commit a populated copy. Real secrets land via
# your secrets-management pipeline (sealed-secrets, External Secrets,
# direct kubectl create from a CI vault, etc.).
#
# SULO credential rotation (R-RUN-1): SULO's REEN API authenticates with a
# username/password exchanged for a short-lived session token (POST /session),
# so there is no two-active-keys overlap to manage. To rotate:
#  1. Change the password in REEN.
#  2. Update SULO_API_PASSWORD here and roll the Deployment.
# The adapter re-authenticates on the next 401, so in-flight polls recover on
# their own; a wrong password surfaces as a permanent vendor error in
# /metrics (vendor_permanent_errors_total{vendor="sulo"}).
apiVersion: v1
kind: Secret
metadata:
  name: translation-layer-secrets
  namespace: geonovum-testbed
type: Opaque
stringData:
  STATE_STORE_DSN: "postgres://USER:PASS@postgres-state:5432/translation_state?sslmode=require"
  # FROST write credential — Basic OR Bearer (Basic wins when the user is set).
  # WBD uses Basic Auth: username "write", password supplied out-of-band.
  FROST_WRITE_TOKEN: ""
  FROST_BASIC_AUTH_USER: "write"
  FROST_BASIC_AUTH_PASSWORD: ""
  # SULO / REEN CMS REST API v3 (https://api.reen.com/guide/). Set all three
  # together to register the adapter, or leave all three empty to disable it.
  SULO_API_BASE_URL: ""
  SULO_API_USERNAME: ""
  SULO_API_PASSWORD: ""
  # Only when the REEN account spans several customer accounts.
  SULO_CUSTOMER_ID: ""
  FRESHNESS_ALERT_WEBHOOK_URL: ""
